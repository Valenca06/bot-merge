name: Snipe Merge Spacewar (Teste 1 Minuto)

on:
  workflow_dispatch:

jobs:
  snipe:
    runs-on: ubuntu-latest
    steps:
      - name: Tentativas de Merge (1 Minuto)
        env:
          GH_TOKEN: ${{ secrets.MY_GH_TOKEN }}
        run: |
          # 6 tentativas com intervalo de 10 segundos = ~1 minuto
          for i in {1..6}; do
            echo "Tentativa $i: Tentando dar merge no PR #1202..."
            
            if gh pr merge 1202 --repo BecoSystems/spacewar --merge; then
              echo "🚀 SUCESSO! MERGE REALIZADO NA TENTATIVA $i!"
              exit 0
            fi
            
            sleep 10
          done
          
          echo "⏱️ 1 minuto concluído. Disparando o próximo ciclo automático!"
          
          # Dispara a si mesmo novamente
          gh workflow run automerge.yml --repo ${{ github.repository }}
