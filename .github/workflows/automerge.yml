name: Snipe Merge Spacewar

on:
  workflow_dispatch: # Permite acionar manualmente no botão
  schedule:
    - cron: '*/5 * * * *' # Roda automaticamente a cada 5 minutos na nuvem

jobs:
  snipe:
    runs-on: ubuntu-latest
    steps:
      - name: Tentativas de Merge
        run: |
          for i in {1..24}; do
            echo "Tentativa $i: Tentando dar merge no PR #1202..."
            if gh pr merge 1202 --repo BecoSystems/spacewar --merge; then
              echo "🚀 SUCESSO! MERGE REALIZADO!"
              exit 0
            fi
            sleep 10
          done
        env:
          GH_TOKEN: ${{ secrets.MY_GH_TOKEN }}
