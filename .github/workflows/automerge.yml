name: Snipe Merge Spacewar (3 Horas)

on:
  workflow_dispatch:

jobs:
  snipe:
    runs-on: ubuntu-latest
    steps:
      - name: Tentativas de Merge Contínuas
        env:
          GH_TOKEN: ${{ secrets.MY_GH_TOKEN }}
        run: |
          # 1080 tentativas x 10 segundos = ~3 horas ininterruptas
          for i in {1..1080}; do
            echo "Tentativa $i: Tentando dar merge no PR #1202..."
            
            if gh pr merge 1202 --repo BecoSystems/spacewar --merge; then
              echo "🚀 SUCESSO! MERGE REALIZADO NA TENTATIVA $i!"
              exit 0 # Encerra definitivamente e impede o reinício
            fi
            
            sleep 10
          done
          
          echo "⏱️ Ciclo de 3 horas finalizado sem sucesso. Reiniciando o robô..."
          
          # Passa o testemunho: dispara a si mesmo para mais 3 horas
          gh workflow run automerge.yml --repo ${{ github.repository }}
